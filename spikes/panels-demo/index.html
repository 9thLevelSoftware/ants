<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FOUNDRESS demo: Colony health, Nest overview, Journal, Codex, markers and overlays</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14110d; overflow: hidden; }
    #scene { position: fixed; inset: 0; }
    #ui { position: fixed; inset: 0; pointer-events: none; font: 14px/1.4 system-ui, sans-serif; color: #f2e9da; }
    /* stand-ins for the 3D scene behind the panels; ?bg=bright is the worst case for legibility, ?bg=nest a cutaway-like soil */
    body[data-bg="dark"] #scene { background: #14110d; }
    body[data-bg="bright"] #scene { background: #ffffff; }
    body[data-bg="nest"] #scene { background: linear-gradient(180deg, #7d8f55 0%, #6b7c45 9%, #4a3a28 10%, #3a2d1f 40%, #2a1f15 100%); }
    body[data-bg="scene"] #scene {
      background:
        radial-gradient(ellipse 14% 9% at 50% 62%, #2a1d12 0%, rgba(42, 29, 18, 0) 100%),
        radial-gradient(ellipse 60% 40% at 70% 8%, #fff7dc 0%, rgba(255, 247, 220, 0) 70%),
        linear-gradient(180deg, #cfe3f0 0%, #e8ecd2 38%, #a7b872 55%, #6f8a3c 70%, #4d6a2a 100%);
    }
  </style>
</head>
<body data-bg="scene">
  <div id="scene"></div>
  <div id="ui"></div>
  <!-- relative URL on purpose: the built output must work from any sub-path -->
  <script type="module" src="./main.tsx"></script>
</body>
</html>
